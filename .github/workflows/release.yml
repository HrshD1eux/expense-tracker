name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Name (e.g. 1.0.1)'
        required: true
        default: '1.0.1'
      release_title:
        description: 'Release Title'
        required: false
        default: ''

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CLEAN_VERSION="${{ github.event.inputs.version_name }}"
            TAG_NAME="v${CLEAN_VERSION}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            CLEAN_VERSION="${TAG_NAME#v}"
          fi
          echo "version_name=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.keystore
            echo "Loaded keystore from GitHub Secrets"
          else
            echo "Generating release keystore on runner..."
            keytool -genkeypair -v \
              -keystore keystore/release.keystore \
              -alias expensetracker \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass expense123 \
              -keypass expense123 \
              -dname "CN=HrshD1eux, OU=ExpenseTracker, O=HrshD1eux, L=City, ST=State, C=IN"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'expense123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'expensetracker' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'expense123' }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version_info.outputs.version_name }} \
            -PversionCode=${{ steps.version_info.outputs.version_code }} \
            --no-daemon

      - name: Locate and Verify Release APK
        id: apk_location
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No release APK found!"
            exit 1
          fi
          TARGET_NAME="ExpenseTracker-v${{ steps.version_info.outputs.version_name }}-release.apk"
          TARGET_PATH="app/build/outputs/apk/release/${TARGET_NAME}"
          if [ "$APK_PATH" != "$TARGET_PATH" ]; then
            cp "$APK_PATH" "$TARGET_PATH"
          fi
          echo "apk_path=${TARGET_PATH}" >> $GITHUB_OUTPUT
          echo "apk_name=${TARGET_NAME}" >> $GITHUB_OUTPUT
          ls -la "$TARGET_PATH"

      - name: Generate Release Notes
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          NOTES_FILE="release_notes.md"
          
          echo "## 🚀 Expense Tracker v${{ steps.version_info.outputs.version_name }}" > $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "### ✨ What's New" >> $NOTES_FILE
          if [ -n "$PREV_TAG" ]; then
            echo "Changes since **$PREV_TAG**:" >> $NOTES_FILE
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s ([%h](https://github.com/HrshD1eux/expense-tracker/commit/%H))" --no-merges >> $NOTES_FILE
          else
            echo "Initial release highlights:" >> $NOTES_FILE
            git log -n 15 --pretty=format:"* %s ([%h](https://github.com/HrshD1eux/expense-tracker/commit/%H))" --no-merges >> $NOTES_FILE
          fi
          echo "" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "### 🔒 Security & Privacy" >> $NOTES_FILE
          echo "* 100% Offline & Private (no cloud tracking, no accounts)" >> $NOTES_FILE
          echo "* Hardware-backed Keystore encryption (SQLCipher)" >> $NOTES_FILE
          echo "* Biometric, Pattern, and Alphanumeric Password Locks" >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "### 📦 Verification & Checksums" >> $NOTES_FILE
          SHA256=$(sha256sum "${{ steps.apk_location.outputs.apk_path }}" | cut -d ' ' -f 1)
          echo "\`SHA256: ${SHA256}\`" >> $NOTES_FILE
          
          cat $NOTES_FILE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: ${{ github.event.inputs.release_title || format('Expense Tracker v{0}', steps.version_info.outputs.version_name) }}
          body_path: release_notes.md
          files: ${{ steps.apk_location.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
